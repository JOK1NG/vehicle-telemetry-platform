server:
  port: 8081   # 与后端 8080 区分，便于本地同时跑

spring:
  application:
    name: vehicle-telemetry-simulator

  # Jackson 默认即可，不需要额外配置

logging:
  level:
    com.iov.platform.simulator: INFO
    org.eclipse.paho: WARN
    org.springframework.integration: WARN

# ===========================
# 模拟器配置
# 全部可通过环境变量覆盖：SIMULATOR_<UPPER_SNAKE>
# ===========================
simulator:
  mqtt:
    url: tcp://localhost:1883
    username: ${SIMULATOR_MQTT_USERNAME:}
    password: ${SIMULATOR_MQTT_PASSWORD:}
    client-id: iov-sim

  # 发布周期（毫秒）。1Hz = 1000ms。
  publish-interval-ms: ${SIMULATOR_PUBLISH_INTERVAL_MS:1000}

  # 显式车辆 ID 列表；设置后覆盖 vehicleCount。
  # 多个用逗号分隔；如 "1,2,3,4,5"
  vehicle-ids: ${SIMULATOR_VEHICLE_IDS:}

  # 当 vehicle-ids 为空时，按此数量自动生成 1..count 的 ID。
  vehicle-count: ${SIMULATOR_VEHICLE_COUNT:5}

  # GCJ-02 基础中心（上海人民广场附近）
  base-center-lng: ${SIMULATOR_BASE_CENTER_LNG:121.473701}
  base-center-lat: ${SIMULATOR_BASE_CENTER_LAT:31.230416}

  # 经纬度扩散范围（度），约 0.05 ≈ 5km
  spread-lng: ${SIMULATOR_SPREAD_LNG:0.05}
  spread-lat: ${SIMULATOR_SPREAD_LAT:0.045}

  # 速度范围 km/h
  min-speed: ${SIMULATOR_MIN_SPEED:20.0}
  max-speed: ${SIMULATOR_MAX_SPEED:60.0}

  # 故障码注入概率（0..1，0 表示不注入）
  fault-probability: ${SIMULATOR_FAULT_PROBABILITY:0.0}

  # 启动后是否自动开始发布
  auto-start: ${SIMULATOR_AUTO_START:true}
