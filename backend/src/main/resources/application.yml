server:
  port: 8080

spring:
  application:
    name: vehicle-telemetry-backend

  # MyBatis-Plus
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

# Actuator 暴露健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.iov.platform: DEBUG
    org.springframework.security: INFO

# JWT 默认配置（可被 profile 覆盖）
jwt:
  secret: ${JWT_SECRET:change_me_jwt_secret_please_use_long_random_string}
  expiration: ${JWT_EXPIRATION:86400000}
