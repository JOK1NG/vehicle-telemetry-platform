server:
  port: 8080

spring:
  application:
    name: vehicle-telemetry-backend

  # Spring AI - Qwen DashScope (OpenAI compatible)
  ai:
    openai:
      api-key: ${AI_QWEN_API_KEY:}
      base-url: ${AI_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3.7-plus}

  # MyBatis-Plus
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

ai:
  vision:
    model: ${AI_VISION_MODEL:qwen3.7-plus}
  dashboard-insight:
    provider: ${AI_DASHBOARD_PROVIDER:qwen}
    api-key: ${AI_DASHBOARD_API_KEY:${AI_QWEN_API_KEY:}}
    base-url: ${AI_DASHBOARD_BASE_URL:${AI_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}}
    model: ${AI_DASHBOARD_MODEL:${AI_VISION_MODEL:qwen3.7-plus}}
    temperature: ${AI_DASHBOARD_TEMPERATURE:0.2}
    max-tokens: ${AI_DASHBOARD_MAX_TOKENS:1200}
    response-format: ${AI_DASHBOARD_RESPONSE_FORMAT:}
    reasoning-effort: ${AI_DASHBOARD_REASONING_EFFORT:}
    image-mode: ${AI_DASHBOARD_IMAGE_MODE:true}
  dashboard-screenshot:
    frontend-base-url: ${AI_DASHBOARD_FRONTEND_BASE_URL:http://localhost:5173}
    chrome-executable-path: ${AI_DASHBOARD_CHROME_PATH:/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}
    timeout-ms: ${AI_DASHBOARD_SCREENSHOT_TIMEOUT_MS:15000}
    viewport-width: ${AI_DASHBOARD_SCREENSHOT_WIDTH:1280}
    viewport-height: ${AI_DASHBOARD_SCREENSHOT_HEIGHT:720}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.iov.platform: DEBUG
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET:change_me_jwt_secret_please_use_long_random_string}
  expiration: ${JWT_EXPIRATION:86400000}
